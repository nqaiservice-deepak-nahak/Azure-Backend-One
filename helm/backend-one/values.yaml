replicaCount: $(BACKEND_ONE_REPLICA_COUNT)

image:
  repository: "$(BACKEND_ONE_IMAGE_URI)"
  tag: "$(IMAGE_TAG)"
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automount: false

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  name: backend-one-service
  type: ClusterIP
  port: 80
  targetPort: $(BACKEND_ONE_PORT)

ingress:
  enabled: true
  className: nginx
  annotations: {}
  paths:
    - path: /api/service-one
      pathType: Prefix
      serviceName: backend-one-service
      servicePort: 80

    - path: /api/service-two
      pathType: Prefix
      serviceName: backend-two-service
      servicePort: 80

resources:
  requests:
    cpu: "$(BACKEND_ONE_CPU)"
    memory: "$(BACKEND_ONE_MEMORY)"
  limits:
    cpu: "$(BACKEND_ONE_CPU)"
    memory: "$(BACKEND_ONE_MEMORY)"

autoscaling:
  enabled: $(BACKEND_ONE_AUTOSCALING_ENABLED)
  minReplicas: $(BACKEND_ONE_MIN_REPLICAS)
  maxReplicas: $(BACKEND_ONE_MAX_REPLICAS)
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

health:
  livenessPath: /api/service-one/health/live
  readinessPath: /api/service-one/health/ready

configVersion: "$(IMAGE_TAG)"

app:
  environment: "$(ENVIRONMENT)"
  name: backend-one
  secretName: backend-one-env
  namespace: "$(K8S_NAMESPACE)"